name: Backend CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Syntax check JS files
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
